# One-off: finds a Naver booking page from a naver.me link and reads what it offers.
name: showroom-probe
on:
  push:
    branches: [showroom-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/res
          python3 probe.py || true
          cd /tmp/res && git init -q -b showroom-probe-result && git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm probe
          git -c http.extraheader="AUTHORIZATION: basic $(printf x-access-token:%s "${{ github.token }}" | base64 -w0)" push -qf "https://github.com/${{ github.repository }}" showroom-probe-result
