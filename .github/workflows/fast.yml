# Checks Present Project about every 30 seconds (and Gurm too until 11/16). GitHub's schedule only starts runs every
# 10-15 minutes, so each run keeps checking in a loop for ~50 minutes instead.
name: fast
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: fast
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ONLY_SHOPS: presentproject
      STATE_FILE: state-fast2.json
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state-fast2.json
          key: duns-fast2-${{ github.run_id }}
          restore-keys: duns-fast2-
      - name: Check every minute
        run: |
          end=$((SECONDS + 50*60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            # pick up code changes (such as a new alert layout) without waiting for the next run
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- check_stock.py parsers.py || true
            # samee asked on 10/16 to watch Gurm every 30 seconds for a month: until the end of 11/16 (KST)
            ONLY_SHOPS=presentproject
            ROTATE_SIZE_SHOPS=
            if [ "$(TZ=Asia/Seoul date +%Y%m%d)" -le 20261116 ]; then ONLY_SHOPS=presentproject,gurm,gurmnew; ROTATE_SIZE_SHOPS=gurm,gurmnew; fi
            ONLY_SHOPS=$ONLY_SHOPS ROTATE_SIZE_SHOPS=$ROTATE_SIZE_SHOPS timeout 120 python3 check_stock.py || echo "check stopped early (exit $?)"
            # start a check every 30 seconds (samee asked on 10/15); never less than 5s apart
            wait=$((30 - (SECONDS - start))); [ $wait -lt 5 ] && wait=5
            sleep $wait
          done
          grep -E 'SKIP|changes=|^[0-9-]+ [0-9:]+   ' log.txt | tail -60 | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=fast::/'; echo
      - name: Save state
        if: ${{ always() && hashFiles('state-fast2.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state-fast2.json
          key: duns-fast2-${{ github.run_id }}
