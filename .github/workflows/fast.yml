# Checks every shop's lists about every minute (samee asked on 10/16), and Present Project, Mini Couple Shot and Gurm about
# every 30 seconds. GitHub's schedule only starts runs every 20-30 minutes, so each run keeps checking in a loop for
# ~50 minutes instead. Single sizes coming back are caught by check.yml's 5-minute size loop (Gurm's here).
name: fast
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: fast
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATE_FILE: state-fast2.json
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state-fast2.json
          key: duns-fast2-${{ github.run_id }}
          restore-keys: duns-fast2-
      - name: Check every minute
        run: |
          end=$((SECONDS + 50*60)); n=0
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            # pick up code changes (such as a new alert layout) without waiting for the next run
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- check_stock.py parsers.py || true
            # every other check reads all shops (about 25s), so each shop is seen about every minute;
            # the checks in between read Present Project, Mini Couple Shot and Gurm
            n=$((n + 1))
            # Mini Couple Shot since 10/17; Gurm with no end date since 10/17 (samee asked)
            ONLY_SHOPS=presentproject,coupleshot,gurm,gurmnew
            ROTATE_SIZE_SHOPS=gurm,gurmnew
            [ $((n % 2)) -eq 1 ] && ONLY_SHOPS=
            ONLY_SHOPS=$ONLY_SHOPS ROTATE_SIZE_SHOPS=$ROTATE_SIZE_SHOPS timeout 120 python3 check_stock.py || echo "check stopped early (exit $?)"
            # start a check every 30 seconds (samee asked on 10/15); never less than 5s apart
            wait=$((30 - (SECONDS - start))); [ $wait -lt 5 ] && wait=5
            sleep $wait
          done
          grep -E 'SKIP|changes=|^[0-9-]+ [0-9:]+   ' log.txt | tail -60 | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=fast::/'; echo
      - name: Save state
        if: ${{ always() && hashFiles('state-fast2.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state-fast2.json
          key: duns-fast2-${{ github.run_id }}
