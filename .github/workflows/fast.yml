# Checks a few shops about every 30 seconds. GitHub's schedule only starts runs every
# 10-15 minutes, so each run keeps checking in a loop for ~50 minutes instead.
name: fast
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: fast
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ONLY_SHOPS: presentproject
      STATE_FILE: state-fast.json
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state-fast.json
          key: duns-fast-${{ github.run_id }}
          restore-keys: duns-fast-
      - name: Check every minute
        run: |
          # Gurm opens new items on 10/15: watch it every minute too until the end of that day (KST)
          if [ "$(TZ=Asia/Seoul date +%Y%m%d)" -le 20261015 ]; then export ONLY_SHOPS=presentproject,gurm,gurmnew; fi
          end=$((SECONDS + 50*60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            timeout 120 python3 check_stock.py || echo "check stopped early (exit $?)"
            # start a check every 30 seconds (samee asked on 10/15); never less than 5s apart
            wait=$((30 - (SECONDS - start))); [ $wait -lt 5 ] && wait=5
            sleep $wait
          done
          grep -E 'SKIP|changes=' log.txt | tail -20 | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=fast::/'; echo
      - name: Save state
        if: ${{ always() && hashFiles('state-fast.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state-fast.json
          key: duns-fast-${{ github.run_id }}
