# Checks every shop's lists about every 35 seconds (samee asked on 10/17). GitHub's schedule only starts runs every
# 20-30 minutes, so each run keeps checking in a loop for ~50 minutes instead. Single sizes coming back are caught by
# check.yml's 5-minute size loop (Gurm's here, by re-reading 60 product pages per check).
name: fast
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: fast
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SOOR_TELEGRAM_TOKEN: ${{ secrets.SOOR_TELEGRAM_TOKEN }}
      SOOR_TELEGRAM_CHAT_ID: ${{ secrets.SOOR_TELEGRAM_CHAT_ID }}
      STATE_FILE: state-fast2.json
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state-fast2.json
          key: duns-fast2-${{ github.run_id }}
          restore-keys: duns-fast2-
      - name: Check every minute
        run: |
          end=$((SECONDS + 50*60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            # pick up code changes (such as a new alert layout) without waiting for the next run
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- check_stock.py parsers.py || true
            # every check reads all shops (samee asked on 10/17 for every shop at about 35 seconds)
            ONLY_SHOPS=
            ROTATE_SIZE_SHOPS=
            # Present Project has only a few items with options: read all of them every check
            SIZE_EVERY_SHOPS=presentproject
            # Cuddly Bunny, Mini Couple Shot (10/20) and Gurm (10/21) have their own 20-second loops in quick.yml
            SKIP_SHOPS=cuddlybunny,coupleshot,gurm,gurmnew ONLY_SHOPS=$ONLY_SHOPS ROTATE_SIZE_SHOPS=$ROTATE_SIZE_SHOPS SIZE_EVERY_SHOPS=$SIZE_EVERY_SHOPS timeout 120 python3 check_stock.py || echo "check stopped early (exit $?)"
            # start a check every 35 seconds; never less than 5s apart
            wait=$((35 - (SECONDS - start))); [ $wait -lt 5 ] && wait=5
            sleep $wait
          done
          grep -E 'SKIP|changes=|^[0-9-]+ [0-9:]+   ' log.txt | tail -60 | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=fast::/'; echo
      - name: Save state
        if: ${{ always() && hashFiles('state-fast2.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state-fast2.json
          key: duns-fast2-${{ github.run_id }}
