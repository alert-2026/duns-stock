# Watches the Duns showroom Naver booking page (samee asked on 10/19) and sends a Telegram alert when booking
# opens or a visit time frees up. Separate from the stock checks; like fast.yml, each run loops for ~50 minutes.
name: showroom
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [check_showroom.py, .github/workflows/showroom.yml]
concurrency:
  group: showroom
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: showroom-state.json
          key: showroom-${{ github.run_id }}
          restore-keys: showroom-
      - name: Save the page as it looks now
        run: |
          curl -sS -L -A "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)" -o /tmp/page.html \
            -w "page %{http_code} %{size_download} %{url_effective}\n" https://m.booking.naver.com/booking/12/bizes/1638569 | tee showroom-log.txt || true
      - name: check every 20 seconds
        run: |
          publish() {  # copies the log to the showroom-status branch so it can be read without opening Actions
            rm -rf /tmp/pub; mkdir /tmp/pub; cp showroom-log.txt /tmp/pub/; cp /tmp/page.html /tmp/pub/ 2>/dev/null || true
            auth=$(git config --get http.https://github.com/.extraheader)
            (cd /tmp/pub && git init -q -b showroom-status && git add -A \
              && git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Showroom check log" \
              && git -c http.extraheader="$auth" push -qf "https://github.com/${{ github.repository }}" showroom-status) || true
          }
          end=$((SECONDS + 50*60)); n=0
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- check_showroom.py || true
            timeout 90 python3 check_showroom.py || true
            n=$((n+1)); [ $n -eq 1 ] && publish
            wait=$((10 - (SECONDS - start))); [ $wait -lt 3 ] && wait=3
            sleep $wait
          done
          tail -c 200000 showroom-log.txt > /tmp/l && mv /tmp/l showroom-log.txt; publish
      - name: Save state
        if: ${{ always() && hashFiles('showroom-state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: showroom-state.json
          key: showroom-${{ github.run_id }}
