# A few single products samee is waiting for (watch_items.py), read every ~8 seconds (asked 10/23).
name: hot
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
concurrency:
  group: hot
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state-hot.json
          key: duns-hot-${{ github.run_id }}
          restore-keys: duns-hot-
      - name: Check every 8 seconds
        run: |
          end=$((SECONDS + 50*60))
          while [ $SECONDS -lt $end ]; do
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- check_stock.py parsers.py watch_items.py || true
            HOT_SECONDS=60 timeout 120 python3 watch_items.py || echo "check stopped early (exit $?)"
          done
      - name: Save state
        if: ${{ always() && hashFiles('state-hot.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state-hot.json
          key: duns-hot-${{ github.run_id }}
