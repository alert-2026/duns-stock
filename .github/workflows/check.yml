name: duns-stock
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Only send a Telegram test message"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: duns-stock
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - name: Send test message
        if: ${{ inputs.test_message }}
        run: python3 check_stock.py --test-message
      # state.json lives in the Actions cache (not in git) so runs don't create commits
      - name: Restore state
        if: ${{ !inputs.test_message }}
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: duns-state-${{ github.run_id }}
          restore-keys: duns-state-
      - name: Check stock
        if: ${{ !inputs.test_message }}
        run: |
          python3 check_stock.py
          # one annotation with the run summary so it can be read without opening the logs
          grep -E 'SKIP|run:|changes=' log.txt | tail -20 | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=duns-stock::/'; echo
      - name: Save state
        if: ${{ !inputs.test_message && hashFiles('state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: duns-state-${{ github.run_id }}
      # last run summary on the heartbeat branch, so the schedule can be checked without the API
      - name: Heartbeat
        if: ${{ !inputs.test_message && always() }}
        run: |
          tail -5 log.txt > /tmp/heartbeat.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -q --orphan heartbeat
          git rm -rfq .
          cp /tmp/heartbeat.txt heartbeat.txt
          git add heartbeat.txt
          git commit -qm "Last run (${{ github.event_name }})"
          git push -qf origin heartbeat
