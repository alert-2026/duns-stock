# Reads every product page for sizes about every 5 minutes and sends only [사이즈 재입고] (samee asked on 10/16);
# fast.yml reads the lists every minute and sends the other alerts. GitHub starts scheduled runs only every
# 20-30 minutes, so each run keeps checking in a loop for ~50 minutes.
name: duns-stock
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Only send a Telegram test message"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: duns-stock
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHROME_PATH: /usr/bin/google-chrome
      SIZE_SCAN: "1"
      SKIP_SHOPS: presentproject  # checked by fast.yml
    steps:
      - uses: actions/checkout@v4
      - name: Send test message
        if: ${{ inputs.test_message }}
        run: python3 check_stock.py --test-message
      # state.json lives in the Actions cache (not in git) so runs don't create commits
      - name: Restore state
        if: ${{ !inputs.test_message }}
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: duns-state-${{ github.run_id }}
          restore-keys: duns-state-
      - name: Check stock
        if: ${{ !inputs.test_message }}
        run: |
          # a stuck shop page must never hang the job until GitHub cancels it (that sends a failure email);
          # a check that is stopped saves nothing, so the next one simply checks again
          end=$((SECONDS + 50*60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            # pick up code changes without waiting for the next run
            git fetch -q --depth 1 origin main && git checkout -q FETCH_HEAD -- check_stock.py parsers.py || true
            # Gurm's sizes are checked by fast.yml until 11/16: here it only keeps its record fresh
            LEARN_ONLY_SHOPS=
            if [ "$(TZ=Asia/Seoul date +%Y%m%d)" -le 20261116 ]; then LEARN_ONLY_SHOPS=gurm,gurmnew; fi
            LEARN_ONLY_SHOPS=$LEARN_ONLY_SHOPS ALERT_LABELS="사이즈 재입고" timeout 420 python3 check_stock.py || echo "run stopped early (exit $?)"
            # start a check every 5 minutes; stop when the next one wouldn't finish in this run
            wait=$((300 - (SECONDS - start))); [ $wait -lt 10 ] && wait=10
            [ $((SECONDS + wait + 420)) -lt $((end + 300)) ] || break
            sleep $wait
          done
          # one annotation with the run summary so it can be read without opening the logs
          grep -E 'SKIP|run:|changes=' log.txt | tail -40 | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice title=duns-stock::/'; echo
      - name: Save state
        if: ${{ always() && !inputs.test_message && hashFiles('state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: duns-state-${{ github.run_id }}
      # last run summary on the heartbeat branch, so the schedule can be checked without the API
      - name: Heartbeat
        if: ${{ !inputs.test_message && always() }}
        run: |
          tail -5 log.txt > /tmp/heartbeat.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -q --orphan heartbeat
          git rm -rfq .
          cp /tmp/heartbeat.txt heartbeat.txt
          git add heartbeat.txt
          git commit -qm "Last run (${{ github.event_name }})"
          git push -qf origin heartbeat
